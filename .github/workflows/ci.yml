name: CI
on: [pull_request, push]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          if git grep -l CI-MUST-FAIL -- . ':!.github'; then
            echo "::error title=Build failed::a file asks CI to fail"
            exit 1
          fi
          echo built
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo linted
